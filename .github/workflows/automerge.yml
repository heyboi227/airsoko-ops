name: Dependabot automerge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Enable automerge for grouped minor and patch updates
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Read the update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # `--auto` queues the merge behind the branch protection rules rather
      # than merging immediately. The full CI matrix -- types, lint, format,
      # domain tests, production build, acceptance scenarios -- must pass
      # first. That is the difference between this and the workflow that let
      # the reference project drift two years out of sync with its own
      # dependency tree.
      - name: Queue merge behind required checks
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave majors for a person
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body \
            "Major version bump — not merged automatically. A person needs to read the changelog."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
