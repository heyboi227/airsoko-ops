name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Keyed by pull request, so a follow-up push supersedes its own run and only
  # the last commit of a branch is tested -- but by commit for a push to main,
  # because two merges landing a minute apart share `refs/heads/main` and the
  # first one's acceptance job, the longest in the matrix, was being cancelled
  # before it finished. A cancelled run is not a green one, and dependabot
  # merges arrive in exactly that pattern.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Static checks need no database and finish in under a minute, so they run
  # first and fail fast.
  static:
    name: Types, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format

  unit:
    name: Domain rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      # The kernel is pure, so its tests need neither a database nor a browser.
      - run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run build

  acceptance:
    name: Acceptance scenarios
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: airsoko
          POSTGRES_PASSWORD: airsoko
          POSTGRES_DB: airsoko_ops
          TZ: UTC
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U airsoko -d airsoko_ops"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
